title: 労働衛生ラボ
description: 現場と法令の「あいだ」をつなぐ学習サイト
url: https://rodoeisei-lab.github.io
baseurl: "/rodoeisei-lab"
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-sitemap

# `exclude` を設定するとJekyll標準の除外一覧を上書きするため、標準値も明示する。
# 編集用の原稿テンプレートはリポジトリには保持し、公開サイトには含めない。
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - templates
  # 公開用サイトに含めない運用・作業用ファイル
  - skills
  - reports
  - work-ops-hub
  - inventory-memo.html

collections:
  guides:
    output: true
    permalink: /guides/:name/
  updates:
    output: true
    permalink: /updates/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page

community:
  repository_url: "https://github.com/rodoeisei-lab/rodoeisei-lab"
  issues_url: "https://github.com/rodoeisei-lab/rodoeisei-lab/issues"
  discussions_url: "https://github.com/rodoeisei-lab/rodoeisei-lab/discussions"
  intro_issue_url: "https://github.com/rodoeisei-lab/rodoeisei-lab/issues/new?template=intro.yml"
  question_issue_url: "https://github.com/rodoeisei-lab/rodoeisei-lab/issues/new?template=question.yml"
  discord_invite_url: ""

community_url: "https://github.com/rodoeisei-lab/rodoeisei-lab/discussions"
google_form_qa_embed_url: ""
qa_form_url: "https://forms.gle/VkhwitiNsNXyNQ2C9"

analytics:
  ga4_measurement_id: ""
  matomo_url: ""
  matomo_site_id: ""

feedback:
  article_form_url: "https://forms.gle/VkhwitiNsNXyNQ2C9"
  article_survey_url: ""
