features:
  - title: 作業環境測定を基礎から整理
    description: A測定・B測定、管理区分、有機溶剤、粉じん、特定化学物質などを、測定前後の判断に使える形で解説。
    icon: 🧪
  - title: 化学物質管理の実務に対応
    description: 自律的管理、リスクアセスメント、濃度基準値、保護具、SDSの読み方を、現場で確認しやすい単位に分解。
    icon: 🧭
  - title: 学習と改善提案をつなぐ
    description: 労働衛生コンサルタント試験の学習、口述対策、改善提案メモづくりまで、実務経験を知識に変換。
    icon: 📘
workflow:
  kicker: 現場での使い方
  title: 測る前・測った後・改善するときに確認する
  description: 単語の暗記ではなく、作業者のばく露を下げるための判断材料として読めるように、測定と管理の流れを3段階で整理します。
  steps:
    - title: 作業と有害要因を把握
      description: 使用物質、発散源、作業姿勢、換気、保護具を洗い出し、SDSや過去の測定結果と照らし合わせます。
    - title: 測定・評価の考え方を確認
      description: A測定・B測定、個人ばく露測定、管理区分、濃度基準値などを目的に応じて使い分けます。
    - title: 改善策へつなげる
      description: 局所排気装置、作業方法、保護具、教育、再測定の優先順位を整理し、現場で説明しやすい言葉にします。

