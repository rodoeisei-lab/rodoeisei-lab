    url: "#"
  - title: フィットテストとは？呼吸用保護具を選ぶ前に確認したいこと
    category: 保護具
    description: 定量的・定性的フィットテストの違い、装着教育、記録の残し方を、保護具選定の入口として整理します。
    url: /guides/fit-test/
  - title: AIで労働衛生を学ぶときの注意点
    category: AI活用
    description: AIの要約を活用しながら、法令・通達・一次情報で必ず確認すべきポイント、現場条件を入力するときの注意、誤情報を避ける見方をまとめます。
    url: "#"
