- title: 2026年10月から、個人ばく露測定は誰が実施する？
  summary: 制度改正後の対象測定と実施体制の確認点を整理。
  key_answer: 一定の法令上の測定では、デザイン・サンプリング・分析を要件を満たす実施者が担う。すべての自主測定が一律の対象ではない。
