- title: SDSは、第15項だけ確認すればよい？
  summary: SDSを現場の化学物質管理に使うための確認順を整理。
  key_answer: 第15項は入口。製品・改訂日、成分・含有率、危険有害性、ばく露防止情報を現場の作業条件と照合する。
