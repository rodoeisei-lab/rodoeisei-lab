- title: 個人サンプリング法は、A・B測定の代わりになる？
  summary: 個人サンプリング法によるC・D測定とA・B測定の使い分けを整理。
  key_answer: 対象物質・指定作業場などの条件を満たす測定では選択できるが、一般的な個人ばく露測定を一律に代用するものではない。
