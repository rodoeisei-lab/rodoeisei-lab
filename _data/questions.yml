- title: 第2種有機溶剤かどうかは、どう確認する？
  summary: SDSの成分・含有率と現行法令を照合する手順を整理。
  key_answer: 製品名ではなくSDS第3項の成分を確認し、対象物質検索と現行法令に照合する。区分だけで必要な措置を確定しない。
