- title: 化学物質のリスクアセスメントは、毎年見直す必要がある？
  summary: 製品・工程・SDSなどの変更時に行う見直しを整理。
  key_answer: 一律の年次周期ではなく、新規採用・変更、作業手順の変更、危険有害性情報の変化などを見直しのきっかけにする。
