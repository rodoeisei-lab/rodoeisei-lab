- title: 呼吸用保護具
  id: respiratory-protection
  selection_note: 対象物質と必要な保護性能を確認し、顔に合うサイズを選びます。
  items:
    - name: 3M Vフレックス 防じんマスク 9105J-DS2（20枚）
      asin: B00AEZILG6
      use_case: 粒子状物質に対する使い捨て式防じんマスクを検討するとき。
      checks:
        - 国家検定区分DS2が作業に必要な区分を満たすか
        - レギュラーサイズが着用者の顔に合うか
        - 正しい装着方法と交換ルールを運用できるか
      caution: 有機溶剤蒸気・特定のガス・酸素欠乏空気には使用できません。対象物質、濃度、酸素濃度に応じて、防毒マスクや送気マスクなどを選びます。
      url: https://amzn.to/49ZC0XX
      source_label: 3M製品情報
      source_url: https://www.3mcompany.jp/3M/ja_JP/p/d/b00037946/
      checked_at: 2026-08-13

- title: 目の保護
  id: eye-protection
  selection_note: 飛来物、粉じん、液体飛沫などに対して、必要な覆い方とフィットを確認します。
  items:
    - name: 山本光学 SN-610 PAF 一眼形保護めがね
      asin: B0D5YGFY1J
      use_case: 飛来物や粉じんに対する一眼形保護めがねを検討するとき。
      checks:
        - 通常のSN-610とガスケット付きSN-610Gのどちらが作業に合うか
        - 顔幅、鼻パッド、つるを調整してずれにくいか
        - 必要な側面保護とレンズ性能を満たすか
      caution: 微細粉じんや液体飛沫など、すき間からの侵入が問題になる作業では、ゴーグル形なども検討します。
      url: https://amzn.to/49FNU83
      source_label: 山本光学製品情報
      source_url: https://yamamoto-kogaku.co.jp/safety/product/category01.php
      checked_at: 2026-08-13

- title: 騒音対策
  id: hearing-protection
  selection_note: 必要な減音量と、正しい装着を継続できる形状の両方を確認します。
  items:
    - name: 3M E-A-R クラシック 耳栓（10ペア）
      asin: B019CCJHT6
      use_case: 使い捨てフォームタイプの耳栓を少量から試すとき。
      checks:
        - 現場の騒音に対して必要な遮音性能を満たすか
        - 正しい挿入方法で耳にフィットするか
        - 1日を目安とする交換を含め、衛生的に管理できるか
      caution: 耳栓の性能値だけで決めず、警報音や会話の聞こえ方、実際の装着状態も確認します。
      url: https://amzn.to/3YMOZGd
      source_label: 3M製品情報
      source_url: https://www.3mcompany.jp/3M/ja_JP/p/d/b00017635/
      checked_at: 2026-08-13

- title: 手の保護
  id: hand-protection
  selection_note: 一般作業用のグリップ手袋と、化学防護手袋を明確に区別します。
  items:
    - name: アトム タフレッド 3双組 1470-3P
      asin: B003AQDR1A
      use_case: 運搬、流通、園芸などで、通気性と滑り止めを重視する一般作業。
      checks:
        - SSからLまでのサイズから手に合うものを選べるか
        - 天然ゴムの手のひらコーティングが作業に適するか
        - 切創、熱、化学物質など別の保護性能が必要ではないか
      caution: この商品を化学防護手袋として紹介しているものではありません。薬品作業では、対象物質に対する実製品の耐透過性能などを別途確認します。
      url: https://amzn.to/4qvyMkW
      source_label: アトム製品情報
      source_url: https://www.atom-glove.co.jp/products/list/detail?id=709
      checked_at: 2026-08-13

- title: 簡易測定
  id: measurement-inspection
  selection_note: 日常点検の目安と、法令上・正式記録用の測定を区別します。
  items:
    - name: FieldNew デジタル照度計
      asin: B0CVRWB5C1
      use_case: 作業場所の明るさを日常点検で確認し、場所や時期による変化を見るとき。
      checks:
        - 測定範囲、分解能、精度が目的を満たすか
        - センサーの向きと測定位置をそろえて記録できるか
        - 校正証明やトレーサビリティが必要な測定ではないか
      caution: 簡易チェック用として掲載しています。法令上の適否判定や証明が必要な測定では、目的に合う校正・管理された機器と測定方法を用います。
      url: https://amzn.to/4jLNtgZ
      checked_at: 2026-08-13
