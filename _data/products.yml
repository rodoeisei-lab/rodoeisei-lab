- title: 呼吸用保護具
  id: respiratory-protection
  summary: 粒子、ガス・蒸気、酸欠など、空気中の危険性に応じて種類と性能を決めます。
  checks:
    - label: 対象物と状態
      detail: 粉じん・ミストなどの粒子か、ガス・蒸気かを区別し、酸素濃度や濃度範囲も確認します。
    - label: 必要な保護性能
      detail: 指定防護係数、国家検定区分、ろ過材・吸収缶の種類が作業条件を満たすか確認します。
    - label: 顔へのフィット
      detail: 面体のサイズ、ひげや眼鏡の影響、シールチェック、対象作業で必要なフィットテストを確認します。
  warning: DS2防じんマスクは粒子用です。有機溶剤蒸気・特定のガス・酸素欠乏空気には使用できません。酸欠のおそれがある作業では、作業条件に適合する送気マスク等を選定します。
  amazon_url: /amazon/#respiratory-protection
  related_url: /guides/fit-test/
  related_label: フィットテストの解説

- title: 目の保護具
  id: eye-protection
  summary: 飛来物、粉じん、液体飛沫などの侵入経路に合わせて、めがね形・ゴーグル形などを選びます。
  checks:
    - label: 危険源
      detail: 飛来物、浮遊粉じん、薬液飛沫、光など、目に入る可能性があるものを特定します。
    - label: 覆う範囲
      detail: 側面保護、ガスケット、密閉性が必要かを確認し、通常の一眼形で足りるか判断します。
    - label: 装着性
      detail: 顔幅、鼻パッド、度付き眼鏡との併用、くもりやすさ、長時間着用時のずれを確認します。
  warning: 一眼形保護めがねにはすき間があります。微細粉じんや液体飛沫では、リスクに応じてゴーグル形などを検討します。
  amazon_url: /amazon/#eye-protection

- title: 聴覚保護具
  id: hearing-protection
  summary: 騒音レベルと作業時間を基に、必要な遮音性能と着用を続けられる形状を選びます。
  checks:
    - label: 騒音ばく露
      detail: 騒音レベル、周波数、ばく露時間を確認し、必要な減音量を見積もります。
    - label: 遮音性能
      detail: 耳栓・イヤーマフの性能表示を確認し、警報や会話が聞こえない過剰遮音も避けます。
    - label: 装着と交換
      detail: 正しい挿入方法、耳の形との相性、衛生管理、使い捨て・再使用の交換ルールを決めます。
  warning: 高性能な耳栓でも、正しく挿入できなければ十分な遮音は得られません。着用教育と装着確認を組み合わせます。
  amazon_url: /amazon/#hearing-protection

- title: 作業用手袋・化学防護手袋
  id: hand-protection
  summary: 滑り止め、切創、熱、化学物質など、守る対象ごとに別の性能を確認します。
  checks:
    - label: 守る対象
      detail: 摩擦・切創・熱・薬品のどれが主なリスクかを分け、一般作業用と化学防護用を混同しません。
    - label: 材質と実製品
      detail: 化学物質では材質名だけで決めず、物質、濃度、温度、接触時間に対する耐透過性能を確認します。
    - label: 作業性と交換
      detail: サイズ、指先感覚、袖口、再使用可否、汚染時の交換・脱ぎ方・廃棄方法を決めます。
  warning: Amazon掲載の「アトム タフレッド」は一般作業用のグリップ手袋であり、化学防護手袋として紹介している商品ではありません。
  amazon_url: /amazon/#hand-protection
  related_url: /guides/skin-hazard-chemicals-protective-gloves/
  related_label: 化学防護手袋の選び方

- title: 簡易測定器
  id: measurement-inspection
  summary: 日常点検の目安に使う機器と、法令・正式記録に使う測定機器を区別します。
  checks:
    - label: 測定目的
      detail: 異常の早期発見、改善前後の比較、法令上の判定など、何のために測るかを先に決めます。
    - label: 測定範囲と精度
      detail: 測定範囲、分解能、精度、応答時間が目的を満たすかを仕様書で確認します。
    - label: 校正と記録
      detail: 校正証明やトレーサビリティの要否、点検方法、測定位置・時刻を残せる運用かを確認します。
  warning: 安価な簡易測定器の値だけで、法令適合や健康影響を断定しません。正式な判定には目的に合う測定方法と管理された機器が必要です。
  amazon_url: /amazon/#measurement-inspection
