- term: 管理区分
  reading: かんりくぶん
  short: 作業環境測定の結果から、対策の優先度を示す区分。
  detail: |-
    A測定の第一・第二評価値と管理濃度を比較し、B測定を行った場合はその結果も含めて第一〜第三管理区分を決定します。
    改善の緊急度や再測定の判断に直結します。
  tags: [測定・評価]
  related: [評価値, 管理濃度]
- term: 第1管理区分
  reading: だいいちかんりくぶん
  short: 良好な状態と判断される管理区分。
  detail: |-
    評価値が管理濃度より十分低い状態です。
    ただし設備変更や作業変化があれば再確認が必要です。
  tags: [測定・評価]
  related: [管理区分]
- term: 第2管理区分
  reading: だいにかんりくぶん
  short: 改善の余地があると判断される管理区分。
  detail: |-
    ばく露が管理濃度に近い、または一部超える可能性があります。
    現場では改善計画や追加測定の対象になります。
  tags: [測定・評価]
  related: [管理区分]
- term: 第3管理区分
  reading: だいさんかんりくぶん
  short: 速やかな改善が必要と判断される管理区分。
  detail: |-
    A測定の評価値と、B測定を行った場合はその結果も含めて決定され、作業環境の改善が求められます。
    工学的対策や作業方法の見直しが優先事項です。
  tags: [測定・評価]
  related: [管理区分, 管理濃度]
- term: 管理濃度
  reading: かんりのうど
  short: 作業環境測定の評価基準となる濃度。
  detail: |-
    A測定の評価値やB測定結果と比較して管理区分を決めるために用います。
    作業環境を評価する基準であり、個人ばく露の許容上限値ではありません。
  tags: [測定・評価]
  related: [評価値, 管理区分]
- term: 評価値
  reading: ひょうかち
  short: 測定結果から計算される評価のための値。
  detail: |-
    幾何平均や幾何標準偏差などを用いて算出します。
    管理濃度と比較して管理区分を決めるときに使います。
  tags: [測定・評価]
  related: [幾何平均, 幾何標準偏差]
- term: A測定
  reading: えーそくてい
  short: 作業場の代表的な状態を把握するための測定。
  detail: |-
    作業場内に複数の測定点を配置して測定します。
    平常作業のばらつきを捉えるための基本測定です。
  tags: [測定・評価]
  related: [測定点]
- term: C測定
  reading: しーそくてい
  short: 個人サンプリング法による作業環境測定の基本測定。
  detail: |-
    労働者へ試料採取機器を装着し、均等ばく露作業ごとに複数の労働者を対象として測定します。
    作業環境評価基準に基づく管理区分の決定に用い、個人の健康リスクそのものを直接判定する測定ではありません。
  tags: [測定・評価]
  related: [個人サンプリング法, D測定, 均等ばく露作業]
- term: D測定
  reading: でぃーそくてい
  short: 高い濃度へのばく露が予想される作業について行う短時間の個人サンプリング測定。
  detail: |-
    個人サンプリング法による作業環境測定のうち、B測定と対応する考え方を持つ測定です。
    対象作業や時間などの実施条件は、作業環境測定基準で確認します。
  tags: [測定・評価]
  related: [個人サンプリング法, C測定]
- term: 個人サンプリング法
  reading: こじんさんぷりんぐほう
  short: 労働者に試料採取機器を装着して行う作業環境測定の方法。
  detail: |-
    C測定・D測定として作業場を評価し、作業環境評価基準に基づく管理区分の決定に用います。
    一般的な個人ばく露測定と外見は似ていますが、目的と評価方法は同じではありません。
  tags: [測定・評価]
  related: [C測定, D測定, 個人ばく露測定]
- term: 測定点
  reading: そくていてん
  short: 作業環境測定で実際に採取するポイント。
  detail: |-
    作業場所の位置関係を踏まえて配置します。
    A測定では複数点の平均的な把握に使います。
  tags: [測定・評価]
  related: [A測定]
- term: 作業環境測定
  reading: さぎょうかんきょうそくてい
  short: 作業環境の実態を把握し、評価・改善につなげるための測定。
  detail: |-
    デザイン、サンプリング、分析を含み、対象には気中有害物質のほか騒音などもあります。
    法令に基づく測定では、対象ごとの測定・評価方法を確認します。
  tags: [測定・評価]
  related: [A測定, C測定]
- term: 個人ばく露測定
  reading: こじんばくろそくてい
  short: 労働者の呼吸域における有害物質濃度等から、作業中のばく露の程度を把握する測定。
  detail: |-
    身体に装着した試料採取機器を用いる方法が代表的です。
    体内吸収量や健康影響を直接測る検査ではありません。
  tags: [ばく露・統計]
  related: [呼吸域, TWA, 個人サンプリング法]
- term: 確認測定
  reading: かくにんそくてい
  short: 必要と判断した場合に、濃度基準値がある物質への労働者のばく露の程度を確認する測定。
  detail: |-
    リスクアセスメントの結果等に基づいて要否を判断します。
    すべての化学物質や作業で一律に必要な測定ではありません。
  tags: [化学物質管理]
  related: [濃度基準値, 個人ばく露測定]
- term: 呼吸域
  reading: こきゅういき
  short: 作業者が呼吸するときに取り込む空気を代表する、顔の近くの領域。
  detail: |-
    個人ばく露測定では、試料採取口を呼吸域の適切な位置へ配置します。
    ポンプ本体の装着位置ではなく、採取口の位置が重要です。
  tags: [ばく露・統計]
  related: [個人ばく露測定]
- term: 均等ばく露作業
  reading: きんとうばくろさぎょう
  short: ばく露の程度がほぼ同じと見込まれる作業。
  detail: |-
    作業内容、物質、時間、換気、発散源との位置関係などから整理します。
    同じ部署に所属することだけでは、同じ均等ばく露作業とは限りません。
  tags: [ばく露・統計]
  related: [最大ばく露労働者, C測定]
- term: 最大ばく露労働者
  reading: さいだいばくろろうどうしゃ
  short: 作業条件から最も高いばく露が推定される労働者。
  detail: |-
    発散源との位置、作業内容、作業時間などから選定します。
    高い側のばく露を見落とさない測定対象者の検討に用います。
  tags: [ばく露・統計]
  related: [均等ばく露作業]
- term: 八時間濃度基準値
  reading: はちじかんのうどきじゅんち
  short: 1日のばく露を八時間の時間荷重平均で評価する濃度基準値。
  detail: |-
    各濃度と継続時間を考慮した値と比較します。
    短時間だけの測定値をそのまま比較するものではありません。
  tags: [化学物質管理]
  related: [TWA, 短時間濃度基準値]
- term: 短時間濃度基準値
  reading: たんじかんのうどきじゅんち
  short: ばく露が最も高いと考えられる15分間の時間荷重平均に関する濃度基準値。
  detail: |-
    法令上の濃度基準値として定められた指標です。
    瞬間的なピーク濃度や、一般的なSTELと同一視しません。
  tags: [化学物質管理]
  related: [八時間濃度基準値, STEL, ピーク濃度]
- term: TWA
  reading: てぃーだぶりゅーえー
  short: 濃度とその継続時間を考慮した時間荷重平均。
  detail: |-
    各時間帯の濃度に時間を掛け、対象時間で割って求めます。
    測定値を個数だけで割る単純な算術平均とは限りません。
  tags: [ばく露・統計]
  related: [サンプリング時間, 八時間濃度基準値]
- term: STEL
  reading: えすてる
  short: 一般に短時間ばく露限界を表す指標。
  detail: |-
    代表的には15分間の時間荷重平均を評価しますが、定義は採用する基準を確認します。
    法令上の短時間濃度基準値と当然に同じ値・同じ制度とは扱いません。
  tags: [ばく露・統計]
  related: [短時間濃度基準値, ピーク濃度]
- term: ピーク濃度
  reading: ぴーくのうど
  short: 濃度変動の中で観測される瞬間的またはごく短時間の最高値。
  detail: |-
    測定機器の応答時間や記録間隔によって見え方が変わります。
    15分間の時間荷重平均である短時間濃度基準値や一般的なSTELとは区別します。
  tags: [ばく露・統計]
  related: [STEL, 短時間濃度基準値]
- term: サンプリング時間
  reading: さんぷりんぐじかん
  short: 試料を採取する時間の長さ。
  detail: |-
    TWAの計算や測定精度に影響します。
    作業のばらつきを考慮して設定します。
  tags: [ばく露・統計]
- term: 検出下限
  reading: けんしゅつかげん
  short: 測定機器で検出できる最小濃度。
  detail: |-
    検出できるかどうかの境界値を示します。
    低濃度評価ではこの値の影響が大きくなります。
  tags: [測定・評価]
- term: 定量下限
  reading: ていりょうかげん
  short: 定量値として信頼できる最小濃度。
  detail: |-
    検出下限より高い濃度で設定されます。
    定量結果の精度を保つために確認が必要です。
  tags: [測定・評価]
- term: 幾何平均
  reading: きかへいきん
  short: 対数正規分布を前提にした平均値。
  detail: |-
    作業環境測定の評価値計算に使われます。
    極端値の影響を受けにくい特徴があります。
  tags: [測定・評価]
  related: [幾何標準偏差]
- term: 幾何標準偏差
  reading: きかひょうじゅんへんさ
  short: 対数正規分布におけるばらつきの指標。
  detail: |-
    幾何平均と組み合わせて評価値を求めます。
    ばく露の変動の大きさを把握できます。
  tags: [測定・評価]
  related: [幾何平均]
- term: ブランク試料
  reading: ぶらんくしりょう
  short: 汚染や取り扱い誤差を確認するための試料。
  detail: |-
    実際の測定と同じ工程で扱い、背景値を確認します。
    測定の信頼性を確保する基本作業です。
  tags: [測定・評価]
- term: 校正
  reading: こうせい
  short: 測定機器の値を標準に合わせて調整すること。
  detail: |-
    サンプリング流量や分析機器の精度確認に必要です。
    校正記録は測定の証拠として保管します。
  tags: [測定・評価]
- term: 有効数字
  reading: ゆうこうすうじ
  short: 測定値を表す際の意味のある桁数。
  detail: |-
    分析精度に応じて適切な桁数で記録します。
    報告書では過度に細かな数字を避けます。
  tags: [測定・評価]
- term: 局所排気装置
  reading: きょくしょはいきそうち
  short: 汚染物質が広がる前に、発散源の近くで捕捉して排出する設備。
  detail: |-
    フードとダクトで発生源から直接排気します。
    発散を抑える代表的な工学的対策の一つです。代替や工程変更など、より上位の措置も先に検討します。
  tags: [保護具・工学対策]
  related: [フード, ダクト]
- term: プッシュプル型換気装置
  reading: ぷっしゅぷるかんき
  short: 吹出し気流と吸込み気流で汚染空気を捕捉・搬送する換気装置。
  detail: |-
    汚染物質の流れを制御し、捕集効率を高めます。
    大型設備や開放系の工程で使われます。
  tags: [保護具・工学対策]
  related: [捕集効率]
- term: 全体換気
  reading: ぜんたいかんき
  short: 作業場へ清浄な空気を供給し、汚染物質を希釈して排出する換気方式。
  detail: |-
    汚染物質を希釈するための基本対策です。
    局所排気の補完として使われます。
  tags: [保護具・工学対策]
- term: フード
  reading: ふーど
  short: 発散源から生じる汚染空気を取り込む局所排気装置の入口。
  detail: |-
    形状や位置が捕集効率に大きく影響します。
    作業動線と干渉しない配置が重要です。
  tags: [保護具・工学対策]
  related: [局所排気装置]
- term: 捕集効率
  reading: ほしゅうこうりつ
  short: 発生した汚染物質をどれだけ捕集できるかの指標。
  detail: |-
    風量・フード形状・作業姿勢などで変化します。
    対策の有効性評価に用います。
  tags: [保護具・工学対策]
- term: 風速
  reading: ふうそく
  short: 空気が単位時間に移動する距離。測定位置と目的を併記する。
  detail: |-
    制御風速、捕捉速度、ダクト内搬送速度は目的と位置が異なります。単に「風速」とだけ記録せず、測定位置と稼働条件を残します。
  tags: [保護具・工学対策]
- term: 風量
  reading: ふうりょう
  short: 単位時間に流路を通過する空気の体積。
  detail: |-
    ダクト断面積と風速から算出します。
    設備の能力評価や点検に用いられます。
  tags: [保護具・工学対策]
- term: ダクト
  reading: だくと
  short: フードで捕捉した空気を清浄装置や排風機、排気口へ運ぶ流路。
  detail: |-
    局所排気装置の排気経路として機能します。
    曲がりや長さが風量低下の原因になります。
  tags: [保護具・工学対策]
- term: 密閉化
  reading: みっぺいか
  short: 発生源を囲い込んで外部への拡散を防ぐ対策。
  detail: |-
    揮発性物質のばく露を低減する基本方針です。
    作業性とのバランスを見て設計します。
  tags: [化学物質管理]
- term: 代替
  reading: だいたい
  short: 有害性の高い物質を別の物質や方法に置き換えること。
  detail: |-
    リスク低減の最優先手段として検討します。
    置換後も安全性評価が必要です。
  tags: [化学物質管理]
  related: [リスクアセスメント]
- term: SDS
  reading: えすでぃーえす
  short: 化学物質の性状や取扱い情報を示す安全データシート。
  detail: |-
    ばく露防止や緊急対応の基本資料です。
    仕入れ時に最新版を確認します。
  tags: [化学物質管理]
  related: [GHS]
- term: GHS
  reading: じーえいちえす
  short: 化学物質の分類と表示の国際調和システム。
  detail: |-
    ピクトグラムや危険有害性情報の基準になります。
    SDSやラベル表示に反映されます。
  tags: [化学物質管理]
- term: 自律的管理
  reading: じりつてきかんり
  short: 事業者が化学物質のリスクを把握し、低減措置を継続する管理の考え方。
  detail: |-
    ラベル・SDSと使用実態を基にリスクアセスメントを行い、結果に応じた措置、記録、見直しにつなげます。
    有機則、特化則、鉛則などが適用される場合は、それらの規定もあわせて守る必要があります。
  tags: [化学物質管理]
  related: [リスクアセスメント, SDS]
- term: 化学物質管理者
  reading: かがくぶっしつかんりしゃ
  short: 化学物質のリスクアセスメント等の管理を担う者。
  detail: |-
    リスクアセスメント対象物を製造・取り扱う事業場など、法令で定める対象では選任が必要です。
    選任要件や職務は事業場の業務により異なるため、最新の法令と厚生労働省資料を確認します。
  tags: [化学物質管理]
  related: [自律的管理, リスクアセスメント]
- term: 保護具着用管理責任者
  reading: ほごぐちゃくようかんりせきにんしゃ
  short: 保護具を使用させる場合に、その適正な選択・使用・保守管理を担う者。
  detail: |-
    リスクアセスメントに基づく措置として労働者に保護具を使用させる事業場など、法令で定める対象では選任が必要です。
    保護具は代替や工学的対策などを検討した上で、適切に選択・管理します。
  tags: [化学物質管理, 保護具・工学対策]
  related: [ばく露低減措置]
- term: 濃度基準値
  reading: のうどきじゅんち
  short: 国が定めた物質について、労働者のばく露を基準以下とするための値。
  detail: |-
    八時間濃度基準値と短時間濃度基準値があり、リスクアセスメント対象物のばく露低減措置に用います。
    作業環境測定の管理区分に用いる管理濃度とは目的と評価方法が異なります。
  tags: [化学物質管理, ばく露・統計]
  related: [管理濃度, 個人ばく露測定]
- term: 皮膚等障害化学物質等
  reading: ひふとうしょうがいかがくぶっしつとう
  short: 皮膚・眼への障害や皮膚からの吸収による健康障害のおそれがある化学物質等。
  detail: |-
    法令上の対象では、不浸透性の保護衣、保護手袋、履物、保護眼鏡等の適切な使用が必要です。
    材質ごとの耐透過性などを確認し、対象物質と作業に適した保護具を選びます。
  tags: [化学物質管理, 保護具・工学対策]
- term: ばく露低減措置
  reading: ばくろていげんそち
  short: 労働者が化学物質にさらされる程度を減らすための措置。
  detail: |-
    危険有害性の低い物質への代替、工程変更、密閉化・局所排気などの工学的対策、作業手順等の管理的対策の順に検討します。
    個人用保護具は、より上位の措置だけではリスクを十分に下げられない場合などに適切に用います。
  tags: [化学物質管理, 保護具・工学対策]
  related: [代替, 局所排気装置]
- term: リスクアセスメント
  reading: りすくあせすめんと
  short: 化学物質の危険性・有害性を特定し、リスクを見積もって対策を決める手順。
  detail: |-
    健康障害に加えて火災・爆発などの危険性も対象にし、対象物を新たに採用・変更するときなど法令上の実施時期に行います。
    作業方法等に変化がなくても、必要に応じて再評価し、対策の優先順位を判断します。
  tags: [化学物質管理]
  related: [代替]
- term: 特化則
  reading: とっかそく
  short: 特定化学物質障害予防規則の通称。
  detail: |-
    健康障害を防止するための測定や設備基準を定めます。
    対象物質の使用現場で遵守が必要です。
  tags: [化学物質管理]
- term: 有機則
  reading: ゆうきそく
  short: 有機溶剤中毒予防規則の通称。
  detail: |-
    測定や換気設備、保護具の管理を定めています。
    有機溶剤作業の基本ルールとして扱われます。
  tags: [化学物質管理]
- term: 鉛則
  reading: なまりそく
  short: 鉛中毒予防規則の通称。
  detail: |-
    鉛業務による健康障害を防止するための措置を定めます。
    金属類を一括して規制する「金属則」という正式な省令はなく、特定の金属化合物等には特化則など、物質や作業に応じた法令を確認します。
  tags: [化学物質管理]
- term: 防毒マスク
  reading: ぼうどくますく
  short: ガス・蒸気用の吸収缶を用いる呼吸用保護具。
  detail: |-
    物質に適した吸収缶の選定が必須です。
    工学的対策の補助として使用します。
  tags: [保護具・工学対策]
  related: [フィットテスト]
- term: フィットテスト
  reading: ふぃっとてすと
  short: 呼吸用保護具の密着性を確認する試験。
  detail: |-
    実際の着用状態で漏れを評価します。
    法令上実施が必要となる対象作業・呼吸用保護具があるため、物質、作業、保護具の適用条件を確認します。
  tags: [保護具・工学対策]
  related: [フィットファクタ]
- term: フィットファクタ
  reading: ふぃっとふぁくた
  short: 呼吸用保護具の密着度合いを示す数値。
  detail: |-
    フィットテストで算出され、漏れの少なさを示します。
    必要な防護性能を満たしているかの判断に使います。
  tags: [保護具・工学対策]
  related: [フィットテスト]
- term: APF
  reading: えーぴーえふ
  short: 期待防護係数を示す指標。
  detail: |-
    保護具がどの程度ばく露を低減できるかの目安です。
    作業のリスクに合わせて保護具を選定します。
  tags: [保護具・工学対策]
- term: 漏れ率
  reading: もれりつ
  short: 保護具や設備からの漏れの割合。
  detail: |-
    フィットテストや設備点検で確認されます。
    漏れが大きい場合は改善や交換が必要です。
  tags: [保護具・工学対策]
- term: 作業環境測定士
  reading: さぎょうかんきょうそくていし
  short: 作業環境測定を実施・評価できる資格者。
  detail: |-
    測定計画の立案や報告書作成を担当します。
    事業場の測定体制の中心的役割です。
  tags: [測定・評価]
- term: 局排点検
  reading: きょくはいでんけん
  short: 局所排気装置の状態や性能を確認する通称。
  detail: |-
    日常確認、作業主任者による点検、定期自主検査は根拠と周期が異なります。適用規則と対象装置を特定します。
  tags: [保護具・工学対策]

- term: 制御風速
  reading: せいぎょふうそく
  short: 適用法令がフード形式等に応じた位置で求める気流速度。
  detail: すべての局所排気装置に共通する値ではなく、対象物質、作業、規則と測定条件を確認します。
  tags: [保護具・工学対策]
- term: 捕捉速度
  reading: ほそくそくど
  short: 発散源の汚染物質をフードへ動かすための発散源付近の気流速度。
  tags: [保護具・工学対策]
- term: ダクト内搬送速度
  reading: だくとないはんそうそくど
  short: 捕捉物質を運び、堆積を抑えるためのダクト内の気流速度。
  tags: [保護具・工学対策]
- term: 囲い式フード
  reading: かこいしきふーど
  short: 発散源を全部または一部囲い、開口から内向きに捕捉するフード。
  tags: [保護具・工学対策]
- term: 外付け式フード
  reading: そとづけしきふーど
  short: 発散源の外側に設け、吸引気流を届かせて捕捉するフード。
  tags: [保護具・工学対策]
- term: レシーバー式フード
  reading: れしーばーしきふーど
  short: 熱上昇流など汚染物質が向かう流れを受け止めるフード。
  tags: [保護具・工学対策]
- term: 排風機
  reading: はいふうき
  short: 局所排気系統に空気を流す圧力差をつくる機器。
  tags: [保護具・工学対策]
- term: 空気清浄装置
  reading: くうきせいじょうそうち
  short: 排気中の粉じんや有害物を分離・処理する装置。
  tags: [保護具・工学対策]
- term: 補給空気
  reading: ほきゅうくうき
  short: 排気した空気を補い、室内の過度な負圧を防ぐために供給する空気。
  tags: [保護具・工学対策]
- term: 静圧
  reading: せいあつ
  short: ダクト系統の状態や抵抗を把握するために用いる空気の圧力。
  tags: [保護具・工学対策]
- term: 圧力損失
  reading: あつりょくそんしつ
  short: ダクト、曲がり、フード、清浄装置等を空気が通る際に失われる圧力。
  tags: [保護具・工学対策]
- term: 生成AI
  reading: せいせいえーあい
  short: 指示に応じて文章、表、画像などを生成する仕組み。
  detail: 自然な出力でも正しいとは限らず、法令データベースや専門職の判断を代替しません。一次情報と数値を人が確認して補助に使います。
  tags: [AI活用]
  related: [プロンプト, ハルシネーション, 人による確認]
- term: プロンプト
  reading: ぷろんぷと
  short: 生成AIへ与える質問、指示、条件、参照資料などの入力。
  detail: 目的と根拠資料を明示しても誤読や誤情報は起こり得ます。個人情報、健康情報、機密情報、認証情報を安易に含めません。
  tags: [AI活用]
  related: [生成AI, データ最小化]
- term: ハルシネーション
  reading: はるしねーしょん
  short: AIが事実と異なる内容や存在しない出典を、もっともらしく生成すること。
  detail: 単なる誤字とは異なります。条文番号、通達、数値、URLが示されても、一次情報を開いて内容と日付を確認します。
  tags: [AI活用]
  related: [生成AI, 人による確認]
- term: 機密情報
  reading: きみつじょうほう
  short: 組織が公開を予定せず、秘密として管理すべき業務上の情報。
  detail: 非公開の測定結果、設備仕様、顧客・事業場情報などは個人情報でなくても、営業秘密や契約上の秘密に該当する可能性があります。
  tags: [AI活用, 情報管理]
  related: [データ最小化]
- term: 要配慮個人情報
  reading: ようはいりょこじんじょうほう
  short: 不当な差別や不利益を生じないよう取扱いに特に配慮を要する個人情報。
  detail: 病歴や健康診断結果などが含まれます。該当性と取扱いは個人情報保護法、公式ガイドライン、組織の規程を確認します。
  tags: [情報管理]
  related: [匿名化, 匿名加工情報]
- term: データ最小化
  reading: でーたさいしょうか
  short: 目的の達成に必要な情報だけを扱う考え方。
  detail: 生成AIが承認済みでも入力を必要最小限にし、実データが不要なら架空事例や架空数値へ置き換えます。
  tags: [AI活用, 情報管理]
  related: [機密情報, プロンプト]
- term: 人による確認
  reading: ひとによるかくにん
  short: AI出力の根拠、数値、現場条件を責任を持つ人が検証すること。
  detail: 法令適用、専門的評価、健康・就業判断の最終決定をAIへ任せず、資格者や担当者が一次情報と照合します。
  tags: [AI活用]
  related: [生成AI, ハルシネーション]
- term: 匿名化
  reading: とくめいか
  short: 情報から個人などを識別しにくくする一般的な処理や状態を表す言葉。
  detail: 氏名を消しても、日時、地域、工程などの組合せから特定される場合があります。個人情報保護法上の匿名加工情報と常に同じ意味ではありません。
  tags: [情報管理]
  related: [匿名加工情報, 要配慮個人情報]
- term: 匿名加工情報
  reading: とくめいかこうじょうほう
  short: 個人情報保護法に定める措置を講じ、特定の個人を識別できず、元の個人情報を復元できないようにした情報。
  detail: 氏名や会社名を削除しただけで該当するとは限りません。作成・提供時の義務を含め、法令と個人情報保護委員会の公式情報を確認します。
  tags: [情報管理]
  related: [匿名化, 要配慮個人情報]
