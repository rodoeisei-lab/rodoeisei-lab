- id: sds
  question: SDSはどこを確認する？
  search_query: SDS 確認
  keywords:
    - SDS
    - 安全データシート
    - どこ
    - 確認
  answer: まず最新版かを確かめ、危険有害性、成分、取扱い・保管、ばく露防止・保護措置、安定性・反応性、有害性、適用法令を確認します。SDSだけで完結させず、使用量、温度、作業時間、換気など実際の作業条件も合わせて確認します。
  article_title: 職場の化学物質管理とは？SDS確認から対策・見直しまで
  article_url: /guides/chemical-management-basics/
  checked_at: 2026-08-11

