  answer: まず職場で使用する製品と化学物質を把握し、容器ラベルと最新版のSDSを確認します。次に、法令上の対象と実際の作業条件を整理し、リスクアセスメント、対策、効果確認、記録・見直しへ進みます。
  article_title: 職場の化学物質管理とは？SDS確認から対策・見直しまで
