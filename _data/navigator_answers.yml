- id: work-environment-measurement
  question: 作業環境測定とは？
  search_query: 作業環境測定
  keywords:
    - 作業環境測定
    - 何をする
  answer: 作業環境測定は、職場の作業環境を把握し、結果を評価して必要な改善につなげる仕組みです。労働衛生ラボでは、デザイン、サンプリング、分析・評価、管理区分、改善という流れで整理しています。
  article_title: 作業環境測定の超入門
  article_url: /guides/work-env-measurement-intro/
  checked_at: 2026-08-11

- id: a-and-b-measurement
  question: A測定とB測定の違いは？
  content_slug: work-environment-measurement-design-sampling
  search_query: A測定 B測定
  keywords:
    - A測定
    - B測定
    - 違い
  answer: A測定は単位作業場所の平均的な状態を把握する測定です。B測定は、発散源に近接する作業などで濃度が最も高くなると考えられる時間と作業位置の状態を把握します。B測定の要否は、対象物質や作業状況を踏まえて確認します。
  article_title: 作業環境測定の超入門
  article_url: /guides/work-env-measurement-intro/
  checked_at: 2026-08-11

- id: work-environment-measurement-design
  question: 作業環境測定のデザインとは？
  content_slug: work-environment-measurement-design-sampling
  search_query: 作業環境測定 デザイン 測定点
  keywords:
    - 作業環境測定
    - デザイン
    - 測定点
    - 単位作業場所
  answer: 作業環境測定のデザインは、対象作業と有害因子を調べ、単位作業場所、測定日時、測定点、測定方式などを現場の実態に合わせて決め、その理由を測定計画へ残す工程です。図面に測定点を置くだけではありません。
  article_title: 作業環境測定のデザインとは？測定点とA・B・C・D測定を整理
  article_url: /guides/work-environment-measurement-design/
  checked_at: 2026-08-11

- id: work-environment-measurement-sampling
  question: 作業環境測定のサンプリングとは？
  content_slug: work-environment-measurement-sampling
  search_query: 作業環境測定 サンプリング 捕集方法
  keywords:
    - 作業環境測定
    - サンプリング
    - 捕集
    - 採気
  answer: サンプリングは、デザインで決めた位置と時間に試料を採取し、分析可能な状態で試験室へつなぐ工程です。物質の状態、分析方法、必要試料量を踏まえて捕集材、流量、採取時間、保存・搬送条件を選びます。
  article_title: 作業環境測定のサンプリングとは？物質の状態から捕集方法を考える
  article_url: /guides/work-environment-measurement-sampling/
  checked_at: 2026-08-11

- id: control-class
  question: 管理区分とは？
  search_query: 管理区分
  keywords:
    - 管理区分
    - 第1管理区分
    - 第2管理区分
    - 第3管理区分
  answer: 管理区分は、作業環境測定の評価結果を第1から第3までに区分したものです。気中有害物質では、A測定から算出した評価値や、必要な場合のB測定値を管理濃度と比較して決定します。対象となる測定ごとに評価方法を確認する必要があります。
  article_title: 作業環境測定の超入門
  article_url: /guides/work-env-measurement-intro/
  checked_at: 2026-08-11

- id: third-control-class
  question: 第3管理区分になったら、まず何を確認する？
  aliases:
    - 第3管理区分
    - 第三管理区分
  search_query: 第3管理区分 対応
  keywords:
    - 第3管理区分
    - 第三管理区分
    - 対応
    - 改善
  answer: まず測定結果と作業状況を照合して、高濃度となった場所・時間・発散源などの原因を確認します。そのうえで、適用法令に必要な措置を確認し、発散抑制や局所排気装置などの工学的対策、作業方法の見直し、対策後の効果確認へ進みます。
  article_title: 第3管理区分になった場合の対応
  article_url: /qa/third-control-class/
  checked_at: 2026-08-11

- id: personal-exposure-measurement
  question: 個人ばく露測定とは？
  search_query: 個人ばく露測定
  keywords:
    - 個人ばく露測定
    - 個人曝露測定
    - 呼吸域
  answer: 個人ばく露測定は、労働者の呼吸域付近にサンプラーなどを装着し、作業中にどの程度の有害物質へばく露したかを把握する方法です。測定前に、目的、対象者、対象作業、測定時間、比較する基準を明確にします。
  article_title: 個人ばく露測定とは？目的・進め方と作業環境測定との関係
  article_url: /guides/personal-exposure-measurement-basics/
  checked_at: 2026-08-11

- id: personal-exposure-vs-work-environment
  question: 個人ばく露測定と作業環境測定の違いは？
  search_query: 個人ばく露測定 作業環境測定 違い
  keywords:
    - 個人ばく露測定
    - 作業環境測定
    - 違い
  answer: 一般的な個人ばく露測定は、労働者の呼吸域でばく露の程度を把握します。一方、作業環境測定は作業場の状態を測定・評価し、管理区分などを通じて作業環境管理へつなげます。測定目的と評価方法を混同しないことが重要です。
  article_title: 個人ばく露測定とは？目的・進め方と作業環境測定との関係
  article_url: /guides/personal-exposure-measurement-basics/
  checked_at: 2026-08-11

- id: c-and-d-measurement
  question: C測定・D測定と個人ばく露測定の違いは？
  content_slug: work-environment-measurement-design-sampling
  search_query: C測定 D測定 個人ばく露測定
  keywords:
    - C測定
    - D測定
    - 個人ばく露測定
    - 違い
  answer: C測定・D測定は、労働者にサンプラーを装着する個人サンプリング法による作業環境測定です。一般的な個人ばく露測定とは、目的と評価方法が異なります。C測定・D測定は作業環境評価基準に基づく作業場の評価に用います。
  article_title: 個人ばく露測定とは？目的・進め方と作業環境測定との関係
  article_url: /guides/personal-exposure-measurement-basics/
  checked_at: 2026-08-11

- id: chemical-management
