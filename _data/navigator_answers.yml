  answer: 化学物質の危険性・有害性を特定し、作業者が接触・ばく露する可能性や火災・爆発などの危険を見積もり、対策の優先度を決める手順です。製品情報だけでなく、使用量、作業時間、温度、換気などの実態を反映させます。
