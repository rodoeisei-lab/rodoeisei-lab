name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Optimize images
        run: python3 scripts/assets/optimize_images.py

      - name: Build site
        run: bundle exec jekyll build

      - name: Verify chat-style navigator data
        run: |
          node --check assets/js/site-navigator.js
          node --check assets/js/learning-compass.js
          node --check assets/js/management-class-calculator.mjs
          node scripts/ci/test_management_class_calculator.mjs
          ruby scripts/ci/verify_navigator_data.rb

      - name: Build Pagefind index
        run: bash scripts/ci/build_pagefind.sh

      - name: Verify Pagefind output
        run: |
          test -f _site/pagefind/pagefind.js
          test -f _site/pagefind/pagefind-ui.js
          test -f _site/pagefind/pagefind-ui.css

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
